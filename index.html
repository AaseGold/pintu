      .photo-choice{aspect-ratio:4/3}
      .gallery-controls{padding-left:2px;padding-right:2px}
      .ranking-page,.gallery-page,#game .game-head,.game-layout{max-width:100%}
    }
    @media(max-width:380px){
      .app{padding-left:11px;padding-right:11px}
      .setup{padding:16px}
      .quick-gallery{gap:6px}
      .source-actions,.difficulty{gap:7px}
      .level{padding-left:4px;padding-right:4px}
    }
    /* Success modal close button */
    .success{position:relative}
    .success-close{position:absolute;right:14px;top:14px;width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.7);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.18s ease}
    .success-close svg{width:17px}
    .success-close:hover{background:var(--ink);border-color:var(--ink);color:#fff;transform:rotate(90deg)}
    @media(max-width:560px){.success-close{right:10px;top:10px;width:31px;height:31px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/><path d="M7 10v4M17 10v4M10 7h4M10 17h4"/></svg></span>拼了个图</div><button id="rankBtn" class="top-rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4H4v3a4 4 0 0 0 4 4M17 4h3v3a4 4 0 0 1-4 4"/><path d="M8 3h8v7a4 4 0 0 1-8 0V3z"/></svg>排行榜</button></header>
    <section id="start" class="screen active">
      <div class="hero">
        <div class="hero-copy"><span class="eyebrow">A LITTLE PUZZLE BREAK</span><h1>拼出好时光</h1></div>
        <div class="setup"><div class="section-head"><h2>选择一张图片</h2></div><div id="quickGallery" class="gallery quick-gallery"></div><div class="source-actions"><button id="galleryBtn" class="source-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="m4 16 5-5 4 4 2-2 5 5"/><circle cx="15.5" cy="9" r="1.5"/></svg>图库</button><label class="source-btn" for="fileInput"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5M5 14v5h14v-5"/></svg><span id="uploadText">本地上传</span></label><input id="fileInput" type="file" accept="image/*"></div><div class="difficulty-wrap"><div id="difficulty" class="difficulty"><button class="level" data-size="2"><strong>轻松</strong><span>2 × 2</span></button><button class="level selected" data-size="3"><strong>经典</strong><span>3 × 3</span></button><button class="level" data-size="4"><strong>挑战</strong><span>4 × 4</span></button><button class="level" data-size="6"><strong>变态</strong><span>6 × 6</span></button></div></div><button id="startBtn" class="primary-btn setup-start">开始拼图 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
      </div>
    </section>
    <section id="ranking" class="screen"><div class="ranking-page"><div class="page-head"><button id="rankBack" class="back" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg><span>返回</span></button><div class="ranking-title"><h1>最佳排行</h1></div></div><div class="rank-card"><div id="rankTabs" class="rank-tabs"><button class="rank-tab" data-size="2"><strong>2 × 2</strong><span>轻松</span></button><button class="rank-tab active" data-size="3"><strong>3 × 3</strong><span>经典</span></button><button class="rank-tab" data-size="4"><strong>4 × 4</strong><span>挑战</span></button><button class="rank-tab" data-size="6"><strong>6 × 6</strong><span>变态</span></button></div><div id="rankList" class="rank-list"></div></div></div></section>
    <section id="galleryScreen" class="screen"><div class="gallery-page"><div class="page-head"><button id="galleryBack" class="back" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg><span>返回</span></button><div class="gallery-title"><h1>风景图库</h1><p>开启你的挑战</p></div></div><div id="photoGrid" class="photo-grid"></div><div class="gallery-controls"><div class="gallery-difficulty-row"><span class="gallery-difficulty-label">选择难度</span><div class="gallery-difficulty"><button id="galleryDifficultyBtn" class="difficulty-select" type="button" aria-haspopup="true" aria-expanded="false"><strong id="galleryDifficulty">经典 · 3 × 3</strong><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg></button><div id="galleryDifficultyMenu" class="difficulty-menu"><button class="difficulty-option" data-size="2" type="button">轻松 <span>2 × 2</span></button><button class="difficulty-option active" data-size="3" type="button">经典 <span>3 × 3</span></button><button class="difficulty-option" data-size="4" type="button">挑战 <span>4 × 4</span></button><button class="difficulty-option" data-size="6" type="button">变态 <span>6 × 6</span></button></div></div></div><button id="galleryConfirm" class="primary-btn gallery-confirm">确认并开始拼图</button></div></div></section>
    <section id="game" class="screen"><div class="game-head"><button id="gameBack" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg><span>返回</span></button><div class="stats"><div class="stat"><small>步数</small><strong id="moves">0</strong></div><div class="stat"><small>用时</small><strong id="timer">00:00</strong></div></div></div><div class="game-layout"><div class="game-main"><div class="board-shell"><div id="board" class="board"></div></div><div class="tools game-tools"><button id="previewBtn" class="tool">查看原图</button><button id="numberBtn" class="tool">显示编号</button><button id="restartBtn" class="tool">重新打乱</button></div></div></div></section>
  </main>
  <div id="previewPopover" class="preview-popover" role="dialog" aria-modal="true" aria-label="查看原图"><div class="preview-card"><button id="previewClose" class="preview-close" type="button" aria-label="关闭">×</button><img id="previewImage" alt="拼图原图"></div></div>
  <div id="modal" class="modal"><div class="success"><button id="modalClose" class="success-close" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="success-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 4 4L19 6"/></svg></div><h2>拼图完成！</h2><p>成绩已自动写入对应难度的排行榜。<br>干得漂亮！</p><div class="result"><div><strong id="resultMoves">0</strong><span>交换步数</span></div><div><strong id="resultTime">00:00</strong><span>完成用时</span></div></div><div class="modal-actions"><button id="rankViewBtn" class="action-btn">查看排行</button><button id="againBtn" class="action-btn primary">再玩一次</button></div></div></div><div id="toast" class="toast"></div>
  <script>
  (()=>{
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    const svg=s=>`data:image/svg+xml;charset=UTF-8,${encodeURIComponent(s)}`;
    const images=[
      {name:'海边日落',src:svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900"><defs><linearGradient id="s" x2="0" y2="1"><stop stop-color="#f7c98d"/><stop offset=".52" stop-color="#f28a6c"/><stop offset="1" stop-color="#20485c"/></linearGradient><linearGradient id="w" x2="0" y2="1"><stop stop-color="#428096"/><stop offset="1" stop-color="#173746"/></linearGradient></defs><rect width="900" height="900" fill="url(#s)"/><circle cx="665" cy="330" r="112" fill="#fff1ba"/><path d="M0 560Q170 520 330 565T680 550T900 570V900H0Z" fill="url(#w)"/><path d="M0 650Q190 610 360 660T710 645T900 660" fill="none" stroke="#bee0df" stroke-width="16"/><path d="M140 525l90-125 80 125z" fill="#1a3944"/><path d="M188 468h16v94h-16z" fill="#182f37"/></svg>`)},
      {name:'山野小屋',src:svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900"><defs><linearGradient id="a" x2="0" y2="1"><stop stop-color="#b9d8d2"/><stop offset="1" stop-color="#edf0d6"/></linearGradient></defs><rect width="900" height="900" fill="url(#a)"/><circle cx="690" cy="210" r="84" fill="#f7df98"/><path d="M0 650 260 390l145 175 120-195 250 280 125-120v370H0z" fill="#31594d"/><path d="M0 710q240-100 455 15T900 690v210H0z" fill="#7d9f69"/><path d="M300 635h252v178H300z" fill="#d69055"/><path d="M265 650l165-140 165 140z" fill="#6e4735"/><path d="M405 700h58v113h-58z" fill="#503c31"/><path d="M333 690h45v48h-45zm144 0h45v48h-45z" fill="#ffe1a0"/></svg>`)},
      {name:'城市夜色',src:svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900"><defs><linearGradient id="n" x2="0" y2="1"><stop stop-color="#182341"/><stop offset=".55" stop-color="#493e67"/><stop offset="1" stop-color="#ef8a67"/></linearGradient></defs><rect width="900" height="900" fill="url(#n)"/><circle cx="700" cy="175" r="75" fill="#fff4c7"/><path d="M0 620h80V450h115v170h70V370h145v250h62V285h125v335h66V405h142v215h95v280H0z" fill="#171d31"/><g fill="#f7c76d"><path d="M105 485h34v28h-34zm0 63h34v28h-34zM295 415h31v34h-31zm53 0h31v34h-31zm-53 65h31v34h-31zm53 0h31v34h-31zM505 330h30v36h-30zm0 68h30v36h-30zm0 68h30v36h-30zM700 455h34v31h-34zm50 0h34v31h-34z"/></g><path d="M0 700q170-45 340 5t330 0 230-5v200H0z" fill="#101829"/></svg>`)}
    ];
    const sceneryImages=[
      {name:'然乌湖雪山',src:'assets/ranwu.webp'},
      {name:'阳光山谷',src:'assets/sun-valley.webp'},
      {name:'青山碧水',src:'assets/green-lake.webp'},
      {name:'高山花海',src:'assets/flower-lake.webp'},
      {name:'静谧山林',src:'assets/quiet-forest.webp'},
      {name:'雪峰倒影',src:'assets/snow-reflection.webp'}
    ];
    const quickImages=[
      {name:'黄山云海',src:'assets/mountain.webp'},
      {name:'花朝汉服',src:'assets/hanfu.webp'},
      {name:'四季古树',src:'assets/seasons.webp'},
      {name:'然乌湖雪山',src:sceneryImages[0].src}
    ];
    const LAST_SIZE_KEY='puzzle-last-difficulty-v1';
    const savedSize=Number(localStorage.getItem(LAST_SIZE_KEY));
    const initialSize=[2,3,4,6].includes(savedSize)?savedSize:3;
    const state={image:quickImages[0].src,size:initialSize,order:[],selected:null,moves:0,seconds:0,timer:null,playing:false,numbers:false,rankingEligible:true,rankSize:3,galleryIndex:0,quickIndex:0};
    const KEY='puzzle-rankings-v1';
    function show(id){$$('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
    function format(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
    function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1700)}
    function difficultyLabel(size){return size===2?'轻松 · 2 × 2':size===4?'挑战 · 4 × 4':size===6?'变态 · 6 × 6':'经典 · 3 × 3'}
    function lastPlayedSize(){const value=Number(localStorage.getItem(LAST_SIZE_KEY));return[2,3,4,6].includes(value)?value:3}
    function syncDifficultyButtons(){$$('.level').forEach(x=>x.classList.toggle('selected',+x.dataset.size===state.size))}
    function renderQuickGallery(){
      $('#quickGallery').innerHTML=quickImages.map((x,i)=>`<button class="image-choice ${i===state.quickIndex?'selected':''}" data-i="${i}" aria-label="${x.name}"><img src="${x.src}" alt="${x.name}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${images[i%images.length].src}'"></button>`).join('');
    }
    $('#quickGallery').onclick=e=>{const b=e.target.closest('.image-choice');if(!b)return;state.quickIndex=+b.dataset.i;const img=b.querySelector('img');state.image=img.src;$$('#quickGallery .image-choice').forEach(x=>x.classList.toggle('selected',x===b));$('#uploadText').textContent='本地上传'};
    function renderGalleryPage(){
      $('#photoGrid').innerHTML=sceneryImages.map((x,i)=>`<button class="photo-choice ${i===state.galleryIndex?'selected':''}" data-i="${i}" aria-label="${x.name}"><img src="${x.src}" alt="${x.name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${images[i%images.length].src}'"><span class="photo-name">${x.name}</span></button>`).join('');
      $('#galleryDifficulty').textContent=difficultyLabel(state.size);
      $$('.difficulty-option').forEach(x=>x.classList.toggle('active',+x.dataset.size===state.size));
    }
    function openGallery(){
      state.size=3;
      state.galleryIndex=0;
      syncDifficultyButtons();
      renderGalleryPage();
      show('#galleryScreen');
    }
    $('#photoGrid').onclick=e=>{const b=e.target.closest('.photo-choice');if(!b)return;state.galleryIndex=+b.dataset.i;$$('.photo-choice').forEach(x=>x.classList.toggle('selected',x===b))};
    function closeGalleryDifficultyMenu(){$('#galleryDifficultyMenu').classList.remove('show');$('#galleryDifficultyBtn').classList.remove('open');$('#galleryDifficultyBtn').setAttribute('aria-expanded','false')}
    $('#galleryDifficultyBtn').onclick=e=>{e.stopPropagation();const menu=$('#galleryDifficultyMenu'),willOpen=!menu.classList.contains('show');closeGalleryDifficultyMenu();if(willOpen){menu.classList.add('show');$('#galleryDifficultyBtn').classList.add('open');$('#galleryDifficultyBtn').setAttribute('aria-expanded','true')}};
    $('#galleryDifficultyMenu').onclick=e=>{e.stopPropagation();const option=e.target.closest('.difficulty-option');if(!option)return;state.size=+option.dataset.size;$('#galleryDifficulty').textContent=difficultyLabel(state.size);$$('.difficulty-option').forEach(x=>x.classList.toggle('active',x===option));syncDifficultyButtons();closeGalleryDifficultyMenu()};
    document.addEventListener('click',closeGalleryDifficultyMenu);
    $('#difficulty').onclick=e=>{const b=e.target.closest('.level');if(!b)return;state.size=+b.dataset.size;$$('.level').forEach(x=>x.classList.toggle('selected',x===b))};
    function shortFileName(name,max=10){const dot=name.lastIndexOf('.');const base=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';if(name.length<=max)return name;const keep=max-ext.length-1;return keep>0?base.slice(0,keep)+'…'+ext:base.slice(0,Math.max(1,max-1))+'…'}
    $('#fileInput').onchange=e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')||file.size>15*1024*1024){toast('请选择 15MB 以内的图片');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const crop=Math.min(img.width,img.height),out=Math.min(1600,crop),c=document.createElement('canvas');c.width=c.height=out;const ctx=c.getContext('2d');ctx.drawImage(img,(img.width-crop)/2,(img.height-crop)/2,crop,crop,0,0,out,out);state.image=c.toDataURL('image/jpeg',.88);$$('#quickGallery .image-choice').forEach(x=>x.classList.remove('selected'));$('#uploadText').textContent=shortFileName(file.name);toast('图片上传成功')};img.src=reader.result};reader.readAsDataURL(file)};
    function shuffle(n){const a=Array.from({length:n},(_,i)=>i);do{for(let i=n-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}while(a.every((x,i)=>x===i));return a}
    function stats(){$('#moves').textContent=state.moves;$('#timer').textContent=format(state.seconds)}
    function renderBoard(){const n=state.size,b=$('#board');b.style.gridTemplateColumns=`repeat(${n},1fr)`;b.classList.toggle('show-numbers',state.numbers);b.innerHTML=state.order.map((p,pos)=>{const x=p%n,y=Math.floor(p/n);return`<button class="tile ${state.selected===pos?'selected':''} ${p===pos?'correct':''}" data-pos="${pos}" style="background-image:url('${state.image}');background-size:${n*100}% ${n*100}%;background-position:${x*100/(n-1)}% ${y*100/(n-1)}%"><span class="tile-no">${p+1}</span></button>`}).join('')}
    function reset(){clearInterval(state.timer);state.order=shuffle(state.size**2);state.selected=null;state.moves=state.seconds=0;state.numbers=false;state.rankingEligible=true;state.playing=true;$('#previewPopover').classList.remove('show');$('#numberBtn').classList.remove('active');$('#numberBtn').textContent='显示编号';stats();renderBoard();state.timer=setInterval(()=>{state.seconds++;stats()},1000)}
    function start(){localStorage.setItem(LAST_SIZE_KEY,String(state.size));state.numbers=false;$('#numberBtn').classList.remove('active');$('#numberBtn').textContent='显示编号';show('#game');reset()}
    $('#board').onclick=e=>{const b=e.target.closest('.tile');if(!b||!state.playing)return;const p=+b.dataset.pos;if(state.selected===null){state.selected=p;renderBoard();return}if(state.selected===p){state.selected=null;renderBoard();return}[state.order[state.selected],state.order[p]]=[state.order[p],state.order[state.selected]];state.selected=null;state.moves++;stats();renderBoard();if(state.order.every((x,i)=>x===i))finish()};
    function readRanks(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&typeof x==='object'?x:{2:[],3:[],4:[],6:[]}}catch{return{2:[],3:[],4:[],6:[]}}}
    function writeRank(){const all=readRanks(),k=String(state.size);all[k]=Array.isArray(all[k])?all[k]:[];all[k].push({seconds:state.seconds,moves:state.moves,playedAt:new Date().toISOString()});all[k]=all[k].sort((a,b)=>a.seconds-b.seconds||a.moves-b.moves).slice(0,5);try{localStorage.setItem(KEY,JSON.stringify(all))}catch{}}
    function dateLabel(v){const d=new Date(v);if(isNaN(d))return'未知时间';return new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
    function renderRanks(){const rows=readRanks()[String(state.rankSize)]||[],list=$('#rankList');if(!rows.length){list.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 21h8M12 17v4M7 4H4v3a4 4 0 0 0 4 4M17 4h3v3a4 4 0 0 1-4 4"/><path d="M8 3h8v7a4 4 0 0 1-8 0V3z"/></svg><strong>还没有排行记录</strong>完成一次 ${state.rankSize} × ${state.rankSize} 拼图后，成绩会出现在这里</div>`;return}list.innerHTML=`<div class="rank-head"><div>序号</div><div>游玩时间</div><div>用时</div></div>`+rows.map((r,i)=>`<div class="rank-row"><div class="rank-no">${i+1}</div><div class="rank-info"><strong>第 ${i+1} 名</strong>${dateLabel(r.playedAt)}</div><div class="rank-time">${format(r.seconds)}<span>${r.moves} 步完成</span></div></div>`).join('')}
    function finish(){state.playing=false;clearInterval(state.timer);state.selected=null;$('#previewPopover').classList.remove('show');renderBoard();if(state.rankingEligible)writeRank();$('.success p').innerHTML=state.rankingEligible?'成绩已自动写入对应难度的排行榜。<br>干得漂亮！':'本局使用过辅助提示，成绩不计入排行榜。<br>拼图仍然完成啦！';$('#resultMoves').textContent=state.moves;$('#resultTime').textContent=format(state.seconds);setTimeout(()=>$('#modal').classList.add('show'),320)}
    $('#startBtn').onclick=start;$('#galleryBtn').onclick=openGallery;$('#galleryBack').onclick=()=>show('#start');$('#galleryConfirm').onclick=()=>{const selected=sceneryImages[state.galleryIndex],displayed=$(`.photo-choice[data-i="${state.galleryIndex}"] img`);state.image=displayed&&displayed.src?displayed.src:selected.src;$$('#quickGallery .image-choice').forEach(x=>x.classList.remove('selected'));$('#uploadText').textContent='本地上传';start()};$('#rankBtn').onclick=()=>{clearInterval(state.timer);state.playing=false;renderRanks();show('#ranking')};$('#rankBack').onclick=()=>show('#start');$('#gameBack').onclick=()=>{clearInterval(state.timer);state.playing=false;$('#previewPopover').classList.remove('show');show('#start')};
    $('#rankTabs').onclick=e=>{const b=e.target.closest('.rank-tab');if(!b)return;state.rankSize=+b.dataset.size;$$('.rank-tab').forEach(x=>x.classList.toggle('active',x===b));renderRanks()};
    $('#previewBtn').onclick=()=>{state.rankingEligible=false;$('#previewImage').src=state.image;$('#previewPopover').classList.add('show')};$('#previewClose').onclick=()=>$('#previewPopover').classList.remove('show');$('#previewPopover').onclick=e=>{if(e.target===$('#previewPopover'))$('#previewPopover').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#previewPopover').classList.remove('show')});$('#restartBtn').onclick=()=>{reset();toast('已重新打乱，可正常计入排行')};$('#numberBtn').onclick=()=>{state.rankingEligible=false;state.numbers=!state.numbers;$('#board').classList.toggle('show-numbers',state.numbers);$('#numberBtn').classList.toggle('active',state.numbers);$('#numberBtn').textContent=state.numbers?'隐藏编号':'显示编号'};
    $('#modalClose').onclick=()=>$('#modal').classList.remove('show');
    $('#againBtn').onclick=()=>{$('#modal').classList.remove('show');reset()};
    $('#rankViewBtn').onclick=()=>{$('#modal').classList.remove('show');state.rankSize=state.size;$$('.rank-tab').forEach(x=>x.classList.toggle('active',+x.dataset.size===state.rankSize));renderRanks();show('#ranking')};
    renderQuickGallery();syncDifficultyButtons();
  })();
  </script>
</body>
</html>
