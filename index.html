    .game-main{max-width:640px;margin-left:auto;margin-right:auto}
    .photo-grid{grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
    .photo-choice{aspect-ratio:16/10}
    .rank-card{padding:clamp(18px,3vw,28px)}
    .gallery-controls{padding-bottom:0}
    @media(max-width:850px){
      .app{width:min(720px,100%)}
      .hero{grid-template-columns:1fr;gap:30px}
      .hero-copy{max-width:580px;margin:0 auto}
      .setup{max-width:560px}
      .ranking-page,.gallery-page{max-width:680px}
    }
    @media(max-width:620px){
      .app{padding-left:14px;padding-right:14px}
      .topbar{margin-bottom:20px}
      .page-head,.game-head{margin-bottom:18px}
      .photo-grid{grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
      .photo-choice{aspect-ratio:4/3}
      .gallery-controls{padding-left:2px;padding-right:2px}
      .ranking-page,.gallery-page,#game .game-head,.game-layout{max-width:100%}
    }
    @media(max-width:380px){
      .app{padding-left:11px;padding-right:11px}
      .setup{padding:16px}
      .quick-gallery{gap:6px}
      .source-actions,.difficulty{gap:7px}
      .level{padding-left:4px;padding-right:4px}
    }
    /* Success modal close button */
    .success{position:relative}
    .success-close{position:absolute;right:14px;top:14px;width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.7);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.18s ease}
    .success-close svg{width:17px}
    .success-close:hover{background:var(--ink);border-color:var(--ink);color:#fff;transform:rotate(90deg)}
    @media(max-width:560px){.success-close{right:10px;top:10px;width:31px;height:31px}}
    /* Persistent local player */
    .top-actions{display:flex;align-items:center;gap:9px}.user-chip{height:40px;padding:0 13px 0 9px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.56);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;transition:.18s ease}.user-chip:hover{transform:translateY(-2px);background:rgba(255,255,255,.9);box-shadow:0 8px 20px rgba(39,37,31,.08)}.user-avatar{width:26px;height:26px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}.user-name{max-width:150px;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:900}
    .rename-card,.confirm-card{width:min(390px,100%);padding:30px;border-radius:25px;background:#fffdf8;box-shadow:0 30px 100px rgba(0,0,0,.25)}.rename-card h2,.confirm-card h2{margin:0 0 14px;font-size:25px}.rename-input{width:100%;height:50px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:800;outline:none;transition:.18s}.rename-input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(239,106,58,.13)}.rename-error{margin:7px 0 0;color:#c2451c;font-size:12px}.rename-error:empty{display:none}.rename-actions{display:grid;gap:9px;margin-top:18px}.rename-actions .action-btn{min-height:46px;border-radius:12px}.rename-actions .logout-btn{color:#b4472a;background:transparent}.confirm-card p{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.7}.confirm-actions{display:grid;grid-template-columns:1fr 1.2fr;gap:9px}.confirm-actions .action-btn{min-height:46px;border-radius:12px}
    @media(max-width:560px){.top-actions{gap:6px}.user-chip{height:38px;padding:0 8px}.user-name{max-width:92px;font-size:12px}.user-avatar{display:none}.top-rank{font-size:0;gap:0}.top-rank svg{width:18px}.rename-card{padding:26px 20px}}

    .login-page{max-width:520px;margin:0 auto}
    .login-card{margin-top:14px;padding:25px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.68);box-shadow:var(--shadow)}
    #login .ranking-title h1{font-size:clamp(28px,5vw,38px);letter-spacing:-.035em}
    .auth-options{display:grid;gap:10px}
    .auth-option{width:100%;min-height:62px;padding:10px 13px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.7);display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;transition:.16s ease}
    .auth-option:hover:not(:disabled),.auth-option.active{border-color:rgba(239,106,58,.55);background:#fff;box-shadow:0 8px 20px rgba(39,37,31,.08)}
    .auth-option:disabled{cursor:not-allowed;opacity:.58}
    .auth-icon{width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900}
    .auth-icon.phone{background:var(--orange)}.auth-icon.qq{background:#12a8e8}.auth-icon.wechat{background:#07c160}
    .auth-copy{flex:1;min-width:0}.auth-copy strong{display:block;font-size:14px}.auth-copy span{display:block;margin-top:3px;color:var(--muted);font-size:11px}
    .auth-arrow{color:var(--muted);font-size:18px;transition:transform .16s ease}.auth-option.active .auth-arrow{transform:rotate(90deg)}.auth-soon{padding:4px 7px;border-radius:999px;background:#e8e5df;color:var(--muted);font-size:10px;font-weight:800}
    .phone-panel{padding:2px 2px 4px}
    .phone-form{display:grid;gap:10px}.phone-form input{width:100%;height:45px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}.phone-form input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(239,106,58,.11)}
    .code-row{display:grid;grid-template-columns:1fr auto;gap:8px}.send-code{min-width:108px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:12px;font-weight:800;cursor:pointer}.send-code:disabled{cursor:not-allowed;color:var(--muted)}
    .bind-submit{height:46px;border:0;border-radius:12px;background:var(--orange);color:#fff;font-weight:900;cursor:pointer}.bind-submit:disabled{opacity:.6;cursor:wait}
    .bind-privacy{margin:10px 0 0;color:var(--muted);font-size:10px;line-height:1.6;text-align:center}
    .rank-empty-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;color:var(--muted);font-size:12px}
    .rank-login{border:0;border-radius:9px;padding:5px 11px;background:rgba(239,106,58,.12);color:#ef6a3a;font-size:12px;font-weight:800;cursor:pointer}
    .rank-row.mine{border:2px solid #e34f43;border-radius:999px;background:rgba(227,79,67,.055);box-shadow:0 0 0 3px rgba(227,79,67,.08)}
    .rank-loading{padding:52px 20px;text-align:center;color:var(--muted);font-size:13px}
    .pending-ranks{display:grid;gap:10px;margin-top:18px;padding-top:17px;border-top:1px dashed rgba(239,106,58,.4)}
    .pending-ranks-title{color:#c64b24;font-size:12px;font-weight:900}
    .pending-ranks .rank-row{background:rgba(239,106,58,.065);border-color:rgba(239,106,58,.22)}
    .pending-ranks .rank-no{background:rgba(239,106,58,.12);color:#c64b24;font-size:13px}
    .pending-estimate{grid-column:1/-1;margin:-5px 0 1px 62px;color:#c64b24;font-size:11px;font-weight:800}
    .pending-login{display:inline;padding:0;border:0;background:transparent;color:#e35329;font:inherit;font-size:.58em;font-weight:900;vertical-align:baseline;cursor:pointer}
    .pending-login:hover{text-decoration:underline}
    .rank-pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;color:var(--muted);font-size:12px}
    .rank-pagination button{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.7);color:var(--ink);font-size:12px;font-weight:800;cursor:pointer}
    .rank-pagination button:disabled{cursor:default;opacity:.38}
    .board-shell,.board{width:100%}.tile{min-width:0;min-height:0}
</style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><button id="versionBtn" class="brand-mark" type="button" aria-label="显示当前版本" title="显示当前版本"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/><path d="M7 10v4M17 10v4M10 7h4M10 17h4"/></svg></button>拼了个图 <span id="appVersion" class="app-version" aria-label="当前版本"></span></div><div class="top-actions"><button id="userChip" class="user-chip" type="button" title="绑定账号保住成绩"><span class="user-avatar">游</span><span id="userName" class="user-name">登录</span></button><button id="rankBtn" class="top-rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4H4v3a4 4 0 0 0 4 4M17 4h3v3a4 4 0 0 1-4 4"/><path d="M8 3h8v7a4 4 0 0 1-8 0V3z"/></svg>排行榜</button></div></header>
    <section id="start" class="screen active">
      <div class="hero">
        <div class="hero-copy"><span class="eyebrow">A LITTLE PUZZLE BREAK</span><h1>拼出好时光</h1></div>
        <div class="setup"><div class="section-head"><h2>选择一张图片</h2></div><div id="quickGallery" class="gallery quick-gallery"></div><div class="source-actions"><button id="galleryBtn" class="source-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="m4 16 5-5 4 4 2-2 5 5"/><circle cx="15.5" cy="9" r="1.5"/></svg>图库</button><label class="source-btn" for="fileInput"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5M5 14v5h14v-5"/></svg><span id="uploadText">本地上传</span></label><input id="fileInput" type="file" accept="image/*"></div><div class="difficulty-wrap"><div id="difficulty" class="difficulty"><button class="level" data-size="2"><strong>轻松</strong><span>2 × 2</span></button><button class="level selected" data-size="3"><strong>经典</strong><span>3 × 3</span></button><button class="level" data-size="4"><strong>挑战</strong><span>4 × 4</span></button><button class="level" data-size="6"><strong>变态</strong><span>6 × 6</span></button></div></div><button id="startBtn" class="primary-btn setup-start">开始拼图 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
      </div>
    </section>
    <section id="ranking" class="screen"><div class="ranking-page"><div class="page-head"><button id="rankBack" class="back" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg><span>返回</span></button><div class="ranking-title"><h1>最佳排行</h1></div></div><div class="rank-card"><div id="rankTabs" class="rank-tabs"><button class="rank-tab" data-size="2"><strong>2 × 2</strong><span>轻松</span></button><button class="rank-tab active" data-size="3"><strong>3 × 3</strong><span>经典</span></button><button class="rank-tab" data-size="4"><strong>4 × 4</strong><span>挑战</span></button><button class="rank-tab" data-size="6"><strong>6 × 6</strong><span>变态</span></button></div><div id="rankList" class="rank-list"></div></div></div></section>
    <section id="galleryScreen" class="screen"><div class="gallery-page"><div class="page-head"><button id="galleryBack" class="back" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg><span>返回</span></button><div class="gallery-title"><h1>风景图库</h1><p>开启你的挑战</p></div></div><div id="photoGrid" class="photo-grid"></div><div class="gallery-controls"><div class="gallery-difficulty-row"><span class="gallery-difficulty-label">选择难度</span><div class="gallery-difficulty"><button id="galleryDifficultyBtn" class="difficulty-select" type="button" aria-haspopup="true" aria-expanded="false"><strong id="galleryDifficulty">经典 · 3 × 3</strong><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg></button><div id="galleryDifficultyMenu" class="difficulty-menu"><button class="difficulty-option" data-size="2" type="button">轻松 <span>2 × 2</span></button><button class="difficulty-option active" data-size="3" type="button">经典 <span>3 × 3</span></button><button class="difficulty-option" data-size="4" type="button">挑战 <span>4 × 4</span></button><button class="difficulty-option" data-size="6" type="button">变态 <span>6 × 6</span></button></div></div></div><button id="galleryConfirm" class="primary-btn gallery-confirm">确认并开始拼图</button></div></div></section>
    <section id="game" class="screen"><div class="game-head"><button id="gameBack" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg><span>返回</span></button><div class="stats"><div class="stat"><small>步数</small><strong id="moves">0</strong></div><div class="stat"><small>用时</small><strong id="timer">00:00</strong></div></div></div><div class="game-layout"><div class="game-main"><div class="board-shell"><div id="board" class="board"></div></div><div class="tools game-tools"><button id="previewBtn" class="tool">查看原图</button><button id="numberBtn" class="tool">显示编号</button><button id="restartBtn" class="tool">重新打乱</button></div></div></div></section>

    <section id="login" class="screen"><div class="login-page"><div class="page-head"><button id="loginBack" class="back" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg><span>返回</span></button><div class="ranking-title"><h1>登录后可进排行榜</h1></div></div><div class="login-card"><div class="auth-options"><button id="phoneOption" class="auth-option" type="button" aria-expanded="false" aria-controls="phonePanel"><span class="auth-icon phone">号</span><span class="auth-copy"><strong>手机验证码</strong><span>推荐 · 无需记密码</span></span><span class="auth-arrow">›</span></button><div id="phonePanel" class="phone-panel" hidden><form id="phoneForm" class="phone-form" autocomplete="off"><input id="phoneInput" type="tel" inputmode="numeric" autocomplete="off" list="phoneHistory" maxlength="11" placeholder="请输入手机号"><datalist id="phoneHistory"></datalist><div class="code-row"><input id="phoneCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码"><button id="sendCodeBtn" class="send-code" type="button">获取验证码</button></div><button id="phoneSubmit" class="bind-submit" type="submit">登录</button></form></div><button id="qqOption" class="auth-option" type="button"><span class="auth-icon qq">Q</span><span class="auth-copy"><strong>QQ 登录</strong><span>使用 QQ 账号快速绑定</span></span><span class="auth-arrow">›</span></button><button class="auth-option" type="button" disabled><span class="auth-icon wechat">微</span><span class="auth-copy"><strong>微信账号登录</strong><span>快捷登录</span></span><span class="auth-soon">暂未开通</span></button></div><p class="bind-privacy">绑定即表示同意使用对应账号标识保存你的游戏资料。</p></div></div></section>
  </main>
  <div id="previewPopover" class="preview-popover" role="dialog" aria-modal="true" aria-label="查看原图"><div class="preview-card"><button id="previewClose" class="preview-close" type="button" aria-label="关闭">×</button><img id="previewImage" alt="拼图原图"></div></div>
  <div id="renameModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="renameTitle"><form id="renameForm" class="rename-card"><h2 id="renameTitle">修改玩家名称</h2><input id="renameInput" class="rename-input" type="text" maxlength="16" autocomplete="nickname" aria-label="玩家名称" aria-describedby="renameError"><div id="renameError" class="rename-error" aria-live="polite"></div><div class="rename-actions"><button class="action-btn primary" type="submit">保存</button><button id="logoutBtn" class="action-btn logout-btn" type="button">退出登录</button></div></form></div>
  <div id="logoutModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="logoutTitle"><div class="confirm-card"><h2 id="logoutTitle">确认退出登录？</h2><p>退出登录后游戏将不再参与排行榜</p><div class="confirm-actions"><button id="logoutCancel" class="action-btn" type="button">暂不退出</button><button id="logoutConfirm" class="action-btn primary" type="button">确认退出</button></div></div></div>
  <div id="modal" class="modal"><div class="success"><button id="modalClose" class="success-close" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="success-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 4 4L19 6"/></svg></div><h2>拼图完成！</h2><p>成绩已自动写入对应难度的排行榜。<br>干得漂亮！</p><div class="result"><div><strong id="resultMoves">0</strong><span>交换步数</span></div><div><strong id="resultTime">00:00</strong><span>完成用时</span></div></div><div class="modal-actions"><button id="rankViewBtn" class="action-btn">查看排行</button><button id="againBtn" class="action-btn primary">再玩一次</button></div></div></div><div id="toast" class="toast"></div>
  <script>

    ];
    const sceneryImages=[
      {name:'然乌湖雪山',src:'assets/ranwu.webp'},
      {name:'阳光山谷',src:'assets/sun-valley.webp'},
      {name:'青山碧水',src:'assets/green-lake.webp'},
      {name:'高山花海',src:'assets/flower-lake.webp'},
      {name:'静谧山林',src:'assets/quiet-forest.webp'},
      {name:'雪峰倒影',src:'assets/snow-reflection.webp'}
    ];
    const quickImages=[
      {name:'黄山云海',src:'assets/mountain.webp'},
      {name:'花朝汉服',src:'assets/hanfu.webp'},
      {name:'四季古树',src:'assets/seasons.webp'},
      {name:'然乌湖雪山',src:sceneryImages[0].src}
    ];

    async function pushScoreToCloud(rec){

        await apiJSON('/api/scores',{method:'POST',body:JSON.stringify({size:rec.size,seconds:rec.seconds,duration_ms:rec.durationMs,moves:rec.moves,client_id:rec.clientId||null})});
        removePendingScore(rec.clientId);

    }
    function readPendingScores(){try{const rows=JSON.parse(localStorage.getItem(PENDING_SCORE_KEY)),valid=Array.isArray(rows)?rows.filter(row=>row&&[2,3,4,6].includes(Number(row.size))):[],latest=new Map();valid.forEach(row=>{const size=Number(row.size),current=latest.get(size);if(!current||String(row.playedAt||'')>=String(current.playedAt||''))latest.set(size,{...row,size})});const normalized=[...latest.values()];if(normalized.length!==valid.length)savePendingScores(normalized);return normalized}catch{return[]}}
    function savePendingScores(rows){try{localStorage.setItem(PENDING_SCORE_KEY,JSON.stringify(rows))}catch{}}
    function queuePendingScore(rec){const size=Number(rec.size),rows=readPendingScores().filter(row=>Number(row.size)!==size);rows.push({...rec,size});savePendingScores(rows)}
    function removePendingScore(clientId){if(!clientId)return;const rows=readPendingScores(),next=rows.filter(row=>row.clientId!==clientId);if(next.length!==rows.length)savePendingScores(next)}
    function ensureLocalScoreIds(){
      const all=readRanks();let changed=false;
      Object.keys(all).forEach(size=>{const rows=Array.isArray(all[size])?all[size]:[];if(rows.length>1){rows.sort((a,b)=>String(b.playedAt||'').localeCompare(String(a.playedAt||'')));all[size]=rows.slice(0,1);changed=true}(all[size]||[]).forEach(row=>{if(!row.clientId){row.clientId=globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;changed=true}})});
      if(changed)try{localStorage.setItem(KEY,JSON.stringify(all))}catch{}
      return all;
    }
    async function syncLocalScoresAfterBinding(){
      if(!cloudUid)return;
      const all=ensureLocalScoreIds(),pending=readPendingScores(),byClientId=new Map();
      Object.entries(all).forEach(([size,rows])=>{if(Array.isArray(rows))rows.forEach(row=>byClientId.set(row.clientId,{...row,size:Number(size)}))});
      pending.forEach(row=>byClientId.set(row.clientId,row));
      const records=[...byClientId.values()];
      if(!records.length)return;
      const results=await Promise.allSettled(records.map(rec=>apiJSON('/api/scores',{method:'POST',body:JSON.stringify({size:rec.size,seconds:Number(rec.seconds)||0,duration_ms:rankDurationMs(rec),moves:Number(rec.moves)||0,client_id:rec.clientId})})));
      const created=results.filter(x=>x.status==='fulfilled'&&x.value.created).length;
      const syncedIds=new Set(records.filter((_,index)=>results[index].status==='fulfilled').map(rec=>rec.clientId));
      savePendingScores(pending.filter(row=>!syncedIds.has(row.clientId)));
      if(created)toast(`已保住 ${created} 条本机成绩`);
    }

    function reset(){clearInterval(state.timer);state.order=shuffle(state.size**2);state.selected=null;state.moves=state.seconds=state.elapsedMs=0;state.startedAt=performance.now();state.numbers=false;state.rankingEligible=true;state.playing=true;$('#previewPopover').classList.remove('show');$('#numberBtn').classList.remove('active');$('#numberBtn').textContent='显示编号';stats();renderBoard();state.timer=setInterval(()=>{state.elapsedMs=performance.now()-state.startedAt;state.seconds=Math.floor(state.elapsedMs/1000);stats()},250)}

    $('#board').onclick=e=>{const b=e.target.closest('.tile');if(!b||!state.playing)return;const p=+b.dataset.pos;if(state.selected===null){state.selected=p;renderBoard();return}if(state.selected===p){state.selected=null;renderBoard();return}[state.order[state.selected],state.order[p]]=[state.order[p],state.order[state.selected]];state.selected=null;state.moves++;stats();renderBoard();if(state.order.every((x,i)=>x===i))finish()};
    function readRanks(){try{const x=JSON.parse(localStorage.getItem(KEY)),all=x&&typeof x==='object'?x:{2:[],3:[],4:[],6:[]};let changed=false;Object.keys(all).forEach(size=>{const rows=Array.isArray(all[size])?all[size]:[];if(rows.length>1){rows.sort((a,b)=>String(b.playedAt||'').localeCompare(String(a.playedAt||'')));all[size]=rows.slice(0,1);changed=true}});if(changed)try{localStorage.setItem(KEY,JSON.stringify(all))}catch{}return all}catch{return{2:[],3:[],4:[],6:[]}}}
    function writeRank(){const all=readRanks(),k=String(state.size),rec={userId:user.id,userName:user.name,seconds:state.seconds,durationMs:Math.round(state.elapsedMs),moves:state.moves,playedAt:new Date().toISOString(),clientId:globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`};all[k]=[rec];try{localStorage.setItem(KEY,JSON.stringify(all))}catch{}pushScoreToCloud({...rec,size:state.size});}
    function dateLabel(v){const d=new Date(v);if(isNaN(d))return'未知时间';return new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
    async function renameUser(nextName){await syncCloudName(nextName);try{localStorage.setItem(USER_KEY,JSON.stringify({...user,name:nextName}))}catch{return false}user.name=nextName;const all=readRanks();let changed=false;Object.values(all).forEach(rows=>{if(!Array.isArray(rows))return;rows.forEach(row=>{if(row&&user.id&&row.userId===user.id){row.userName=nextName;changed=true}})});if(changed)try{localStorage.setItem(KEY,JSON.stringify(all))}catch{}return true}
    function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
    function shortPlayerName(value){const characters=[...String(value)];return characters.length>6?characters.slice(0,6).join('')+'…':characters.join('')}
    function estimatedPendingRank(row){if(!rankRowsLoaded)return null;const duration=rankDurationMs(row),moves=Number(row.moves)||0,better=currentRankRows.filter(r=>{const rankedDuration=rankDurationMs(r),rankedMoves=Number(r.moves)||0;return rankedDuration<duration||(rankedDuration===duration&&rankedMoves<=moves)}).length,rank=better+1;return rank<=50?rank:null}
    function pendingRanksHtml(){if(cloudUid)return'';const rows=readPendingScores().filter(row=>Number(row.size)===state.rankSize);if(!rows.length)return'';return'<div class="pending-ranks"><div class="pending-ranks-title">本机待入库</div>'+rows.map(r=>{const duration=rankDurationMs(r),seconds=Math.floor(duration/1000),fullName=String(r.userName||user.name||'匿名玩家'),estimatedRank=estimatedPendingRank(r),estimate=estimatedRank?'<div class="pending-estimate">预计排行第 '+estimatedRank+' 名</div>':'';return'<div class="rank-row pending"><div class="rank-no">—</div><div class="rank-info"><strong title="'+escapeHtml(fullName)+'">'+escapeHtml(shortPlayerName(fullName))+'</strong>'+dateLabel(r.playedAt)+'</div><div class="rank-time">'+format(seconds)+'<span class="rank-milliseconds">.'+formatMilliseconds(duration)+'</span><button class="pending-login" type="button">（待入库）</button><span class="rank-meta">'+(Number(r.moves)||0)+' 步完成</span></div>'+estimate+'</div>'}).join('')+'</div>'}
    function bindRankActions(){$$('.pending-login').forEach(button=>button.onclick=()=>openBinding('#ranking'));const login=$('#rankLoginBtn');if(login)login.onclick=()=>openBinding('#ranking');$$('[data-rank-page]').forEach(button=>button.onclick=()=>{const step=button.dataset.rankPage==='next'?1:-1;state.rankPage+=step;renderRankRows(currentRankRows)})}
    function renderRankLoading(){const list=$('#rankList');if(!list)return;list.innerHTML='<div class="rank-empty-bar"><span>全球前 50 名</span></div><div class="rank-loading">正在加载排行榜…</div>'+pendingRanksHtml();bindRankActions()}
    function renderRankError(){const list=$('#rankList');if(!list)return;list.innerHTML='<div class="rank-empty-bar"><span>全球前 50 名</span></div><div class="empty"><strong>排行榜加载失败</strong>请稍后重试</div>'+pendingRanksHtml();bindRankActions()}
    function renderRanks(){loadCloudRanks()}
    function renderRankRows(rows){const list=$('#rankList');if(!list)return;const cta=!cloudUid&&!readPendingScores().some(row=>Number(row.size)===state.rankSize)?'<button id="rankLoginBtn" class="rank-login" type="button">登录后上传成绩</button>':'';const bar='<div class="rank-empty-bar"><span>全球前 50 名</span>'+cta+'</div>',pending=pendingRanksHtml();if(!rows||!rows.length){list.innerHTML=bar+'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 21h8M12 17v4M7 4H4v3a4 4 0 0 0 4 4M17 4h3v3a4 4 0 0 1-4 4"/><path d="M8 3h8v7a4 4 0 0 1-8 0V3z"/></svg><strong>云端还没有记录</strong>完成一次 '+state.rankSize+' × '+state.rankSize+' 拼图后，成绩会出现在这里</div>'+pending;bindRankActions();return}const pageSize=10,totalPages=Math.ceil(Math.min(rows.length,50)/pageSize);state.rankPage=Math.min(Math.max(1,state.rankPage),totalPages);const start=(state.rankPage-1)*pageSize,pageRows=rows.slice(start,start+pageSize),pagination=totalPages>1?'<div class="rank-pagination"><button type="button" data-rank-page="prev"'+(state.rankPage===1?' disabled':'')+'>上一页</button><span>'+state.rankPage+' / '+totalPages+'</span><button type="button" data-rank-page="next"'+(state.rankPage===totalPages?' disabled':'')+'>下一页</button></div>':'';list.innerHTML=bar+'<div class="rank-head"><div>序号</div><div>玩家 / 游玩时间</div><div>用时</div></div>'+pageRows.map((r,i)=>{const duration=rankDurationMs(r),seconds=Math.floor(duration/1000),fullName=String(r.userName||'匿名玩家'),mine=!!(cloudUid&&r.userId===cloudUid);return'<div class="rank-row'+(mine?' mine':'')+'"><div class="rank-no">'+(start+i+1)+'</div><div class="rank-info"><strong title="'+escapeHtml(fullName)+'">'+escapeHtml(shortPlayerName(fullName))+'</strong>'+dateLabel(r.playedAt)+'</div><div class="rank-time">'+format(seconds)+'<span class="rank-milliseconds">.'+formatMilliseconds(duration)+'</span><span class="rank-meta">'+(Number(r.moves)||0)+' 步完成</span></div></div>'}).join('')+pagination+pending;bindRankActions()}
    function finish(){state.elapsedMs=performance.now()-state.startedAt;state.seconds=Math.floor(state.elapsedMs/1000);state.playing=false;clearInterval(state.timer);state.selected=null;$('#previewPopover').classList.remove('show');renderBoard();if(state.rankingEligible)writeRank();$('.success p').innerHTML=state.rankingEligible?(cloudUid?'成绩已自动写入全球排行榜。<br>干得漂亮！':'成绩已保存在本机。<br>绑定账号后可上榜，也能换设备找回。'):'本局使用过辅助提示，成绩不计入排行榜。<br>拼图仍然完成啦！';$('#resultMoves').textContent=state.moves;$('#resultTime').textContent=format(state.seconds);setTimeout(()=>$('#modal').classList.add('show'),320)}
    $('#startBtn').onclick=start;$('#galleryBtn').onclick=openGallery;$('#galleryBack').onclick=()=>show('#start');$('#galleryConfirm').onclick=()=>{const selected=sceneryImages[state.galleryIndex],displayed=$(`.photo-choice[data-i="${state.galleryIndex}"] img`);state.image=displayed&&displayed.src?displayed.src:selected.src;$$('#quickGallery .image-choice').forEach(x=>x.classList.remove('selected'));$('#uploadText').textContent='本地上传';start()};$('#rankBtn').onclick=()=>{clearInterval(state.timer);state.playing=false;state.rankPage=1;renderRanks();show('#ranking')};$('#rankBack').onclick=()=>show('#start');$('#gameBack').onclick=()=>{clearInterval(state.timer);state.playing=false;$('#previewPopover').classList.remove('show');show('#start')};
    $('#rankTabs').onclick=e=>{const b=e.target.closest('.rank-tab');if(!b)return;state.rankSize=+b.dataset.size;state.rankPage=1;$$('.rank-tab').forEach(x=>x.classList.toggle('active',x===b));renderRanks()};
    $('#previewBtn').onclick=()=>{state.rankingEligible=false;$('#previewImage').src=state.image;$('#previewPopover').classList.add('show')};$('#previewClose').onclick=()=>$('#previewPopover').classList.remove('show');$('#previewPopover').onclick=e=>{if(e.target===$('#previewPopover'))$('#previewPopover').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#previewPopover').classList.remove('show')});$('#restartBtn').onclick=()=>{reset();toast('已打乱，重新挑战吧')};$('#numberBtn').onclick=()=>{state.rankingEligible=false;state.numbers=!state.numbers;$('#board').classList.toggle('show-numbers',state.numbers);$('#numberBtn').classList.toggle('active',state.numbers);$('#numberBtn').textContent=state.numbers?'隐藏编号':'显示编号'};
    function closeRename(){$('#renameModal').classList.remove('show');$('#renameError').textContent='';$('#userChip').focus()}
    $('#versionBtn').onclick=()=>toast(`当前版本：${APP_VERSION}`,3000);
    $('#userChip').onclick=()=>{if(!cloudUid){openBinding();return}const input=$('#renameInput');input.value=user.name;$('#renameError').textContent='';$('#renameModal').classList.add('show');requestAnimationFrame(()=>{input.focus();input.select()})};
    function closeLogoutConfirm(){$('#logoutModal').classList.remove('show');$('#logoutBtn').focus()}
    $('#renameModal').onclick=e=>{if(e.target===$('#renameModal'))closeRename()};$('#renameForm').onsubmit=async e=>{e.preventDefault();const nextName=$('#renameInput').value.trim().replace(/\s+/g,' ');if(!nextName||[...nextName].length>16){$('#renameError').textContent='请输入 1—16 个字符的名字';return}const save=e.submitter||$('#renameForm button[type="submit"]');save.disabled=true;save.textContent='保存中…';try{if(!await renameUser(nextName))throw new Error('请允许浏览器本地存储后重试');syncUserChip();if($('#ranking').classList.contains('active'))renderRanks();closeRename();toast('名字修改成功')}catch(err){$('#renameError').textContent=err.message||'保存失败，请重试'}finally{save.disabled=false;save.textContent='保存'}};
    $('#logoutBtn').onclick=()=>$('#logoutModal').classList.add('show');$('#logoutCancel').onclick=closeLogoutConfirm;$('#logoutModal').onclick=e=>{if(e.target===$('#logoutModal'))closeLogoutConfirm()};$('#logoutConfirm').onclick=async()=>{const button=$('#logoutConfirm');button.disabled=true;button.textContent='正在退出…';try{await apiJSON('/api/auth/logout',{method:'POST'});cloudUid=null;closeLogoutConfirm();closeRename();syncUserChip();if($('#ranking').classList.contains('active'))renderRanks();toast('已退出登录')}catch(err){toast(err.message||'退出失败，请重试',2000)}finally{button.disabled=false;button.textContent='确认退出'}};
    document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#logoutModal').classList.contains('show'))closeLogoutConfirm();else if($('#renameModal').classList.contains('show'))closeRename()});
    $('#modalClose').onclick=()=>$('#modal').classList.remove('show');
    $('#againBtn').onclick=()=>{$('#modal').classList.remove('show');reset()};
    $('#rankViewBtn').onclick=()=>{$('#modal').classList.remove('show');state.rankSize=state.size;state.rankPage=1;$$('.rank-tab').forEach(x=>x.classList.toggle('active',+x.dataset.size===state.rankSize));renderRanks();show('#ranking')};
    readRanks();readPendingScores();syncUserChip();renderPhoneHistory();renderQuickGallery();syncDifficultyButtons();initCloudAuth();
  })();
